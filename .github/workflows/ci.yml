name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Manual trigger, so a deploy can be run without pushing to main.
  workflow_dispatch:

defaults:
  run:
    working-directory: front-end

jobs:
  build-and-deploy:
    name: Build, Test & Deploy
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: "--max-old-space-size=4096"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: front-end/package-lock.json

      - run: npm ci
      # The Prisma client is generated, not committed: every later step imports
      # types that do not exist until this runs.
      - run: npx prisma generate

      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - name: Build OpenNext Worker
        run: |
          npm run cf:build
          echo "=== .open-next directory structure ==="
          find .open-next -maxdepth 4 || true
          if [ -f .open-next/server-functions/default/front-end/handler.mjs ] && [ ! -f .open-next/server-functions/default/handler.mjs ]; then
            echo "Fixing nested front-end/handler.mjs path"
            cp .open-next/server-functions/default/front-end/handler.mjs .open-next/server-functions/default/handler.mjs
          fi
          if [ -f .open-next/server-functions/default/index.mjs ] && [ ! -f .open-next/server-functions/default/handler.mjs ]; then
            echo "Fixing missing handler.mjs from index.mjs"
            cp .open-next/server-functions/default/index.mjs .open-next/server-functions/default/handler.mjs
          fi

      - name: Deploy to Cloudflare
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          npx wrangler whoami
          npm run cf:deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
